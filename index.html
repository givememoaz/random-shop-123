<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Random Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Random Shop</h1>
  <p>Cool random items you didn’t know you needed</p>
</header>

<main>
  <section class="products">
    <div class="product">
      <h2>Item #1</h2>
      <p>Short description of the item.</p>
      <p class="price">$10.00</p>
      <button>Buy</button>
    </div>

    <div class="product">
      <h2>Item #2</h2>
      <p>Another cool item description.</p>
      <p class="price">$15.00</p>
      <button>Buy</button>
    </div>
  </section>
</main>

<footer>
  <p>© 2026 Random Shop</p>
</footer>

</body>
</html>
