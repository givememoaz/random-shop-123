<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nebula Clouds</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="space-overlay">

<header>
  <h1>Nebula Clouds</h1>
  <p>Cosmic goods drifting through the universe ✨</p>
  <button id="cart-btn">🛒 Cart (<span id="cart-count">0</span>)</button>
</header>

<main class="products">
  <div class="product">
    <h2>Starlight Core</h2>
    <p>Condensed cosmic energy.</p>
    <p class="price">$10</p>
    <button onclick="addToCart('Starlight Core', 10)">Add to Cart</button>
  </div>

  <div class="product">
    <h2>Nebula Relic</h2>
    <p>Recovered from deep space.</p>
    <p class="price">$15</p>
    <button onclick="addToCart('Nebula Relic', 15)">Add to Cart</button>
  </div>

  <div class="product">
    <h2>Void Fragment</h2>
    <p>Mysterious and unstable.</p>
    <p class="price">$25</p>
    <button onclick="addToCart('Void Fragment', 25)">Add to Cart</button>
  </div>
</main>

<!-- CART PANEL -->
<div id="cart-panel">
  <h2>Your Cart</h2>
  <div id="cart-items"></div>
  <p class="total">Total: $<span id="cart-total">0</span></p>
  <button class="checkout" onclick="checkout()">Checkout</button>
</div>

<footer>
  © 2026 Nebula Clouds
</footer>

</div>

<script src="script.js"></script>
</body>
</html>
