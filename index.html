<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Random Shop</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }
    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .products {
      display: flex;
      gap: 20px;
      padding: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .product {
      background: white;
      padding: 15px;
      width: 200px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .price {
      font-weight: bold;
    }
    button {
      background: black;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      cursor: pointer;
    }
    button:hover {
      background: #444;
    }
    footer {
      text-align: center;
      padding: 10px;
      color: #666;
    }
  </style>
</head>
<body>

<header>
  <h1>Random Shop</h1>
  <p>Cool random items you didn’t know you needed</p>
</header>

<main>
  <section class="products">
    <div class="product">
      <h2>Item #1</h2>
      <p>Short description of the item.</p>
      <p class="price">$10.00</p>
      <button>Buy</button>
    </div>

    <div class="product">
      <h2>Item #2</h2>
      <p>Another cool item description.</p>
      <p class="price">$15.00</p>
      <button>Buy</button>
    </div>
  </section>
</main>

<footer>
  <p>© 2026 Random Shop</p>
</footer>

</body>
</html>
