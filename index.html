<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nebula Clouds</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: url("nebula.png") no-repeat center center fixed;
      background-size: cover;
      color: white;
    }

    .overlay {
      background: rgba(5, 5, 20, 0.75);
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 60px 20px;
    }

    header h1 {
      font-size: 3rem;
      background: linear-gradient(90deg, #9d7cff, #5ee7ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: #cfcfff;
      font-size: 1.1rem;
    }

    .products {
      display: flex;
      justify-content: center;
      gap: 25px;
      padding: 40px;
      flex-wrap: wrap;
    }

    .product {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 20px;
      width: 220px;
      box-shadow: 0 0 20px rgba(150, 120, 255, 0.3);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .product:hover {
      transform: translateY(-8px);
      box-shadow: 0 0 30px rgba(120, 200, 255, 0.6);
    }

    .price {
      font-weight: bold;
      margin: 10px 0;
      color: #9dfffb;
    }

    button {
      background: linear-gradient(90deg, #7f5cff, #4adede);
      border: none;
      color: black;
      padding: 12px;
      width: 100%;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 12px rgba(120, 200, 255, 0.7);
      transition: box-shadow 0.3s, transform 0.2s;
    }

    button:hover {
      box-shadow: 0 0 25px rgba(180, 255, 255, 1);
      transform: scale(1.05);
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #aaa;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="overlay">

<header>
  <h1>Nebula Clouds</h1>
  <p>Cosmic finds drifting through the universe ✨</p>
</header>

<main>
  <section class="products">
    <div class="product">
      <h2>Starlight Item</h2>
      <p>Mysterious cosmic object.</p>
      <p class="price">$10.00</p>
      <button onclick="buyItem('Starlight Item')">Buy</button>
    </div>

    <div class="product">
      <h2>Nebula Relic</h2>
      <p>Recovered from deep space.</p>
      <p class="price">$15.00</p>
      <button onclick="buyItem('Nebula Relic')">Buy</button>
    </div>
  </section>
</main>

<footer>
  <p>© 2026 Nebula Clouds</p>
</footer>

</div>

<script>
  function buyItem(itemName) {
    alert(itemName + " added to cart 🚀\nCheckout system coming soon!");
  }
</script>

</body>
</html>
